# Project Configuration
# Generated by Project Prometheus

project:
  name: "project_name"
  version: "0.1.0"
  description: "Brief project description"
  author: "Project Prometheus"

# Research Configuration
research:
  hypothesis: ""
  research_questions: []
  keywords: []

# Data Configuration
data:
  input_dir: "data/"
  output_dir: "outputs/"
  cache_dir: "data/cache/"

# Experiment Configuration
experiment:
  seed: 42
  num_trials: 5
  batch_size: 32
  learning_rate: 0.001

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "outputs/experiment.log"

# Prometheus Integration
prometheus:
  checkpoint_dir: "outputs/checkpoints/"
  auto_commit: true
  report_format: "markdown"
